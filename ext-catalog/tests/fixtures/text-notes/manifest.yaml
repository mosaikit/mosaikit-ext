#
# A fixture of the tests of the catalog (EXT-105): the kind "text note" (*.note, text/x-note, or a text
# that starts with "NOTE:"), with its icon, a preview, two states and an action, as an extension of a
# product adds its own kinds of files to the file manager. It reads its notes again in its jobs through
# signed links to their content, without a copy (EXT-107), and has an app, which an organization turns
# off to make the kind absent there (EXT-106).
id: org.example.textnotes
version: 0.1.0
name: Text notes (fixture)
description: A kind of files of the catalog for its tests, with a preview and an action.
kind: [app, service]
platform: '>=0.1 <1'
# The catalog is used when it is there: without it, the extension has nothing to do.
optional:
  io.github.mosaikit.ext.catalog: '>=0.1 <1'
backend:
  jar: lib/fixture-text-notes.jar
  api: text-notes
contracts:
  implements:
    - contract: io.github.mosaikit.ext.catalog/file-kind
      version: 1
      api: io.github.mosaikit.ext:ext-catalog-api
frontend:
  entry: web/index.js
  isolation: module
contributes:
  # Turning its app off in an organization turns the extension off there (MK-030, MK-133).
  rail.app:
    - id: notes
      title: Text notes
      route: /app/text-notes
      element: example-text-notes-app
      icon: web/note.svg
      order: 90
  catalog.file-kind:
    - id: note
      kind: text-note
      title: Text note
      icon: web/note.svg
      preview: example-text-note-preview
      states: { counted: Counted, empty: Empty }
      actions:
        - { id: count, title: Count words, element: example-text-note-count }
      i18n:
        it:
          title: Nota di testo
          state.counted: Contata
          state.empty: Vuota
          action.count: Conta le parole
libraries:
  # Written by the build of the extension from its runtime dependencies (MK-131): do not edit.
  - jar: 'lib/ext-catalog-api-1.1.0.jar'
    coordinates: 'io.github.mosaikit.ext:ext-catalog-api:1.1.0'
    sha256: 'b7c26e130afdbaffb932d8c772a2be2b09e6dc919ff340b71371d9f23e7e8c11'
