id: io.github.mosaikit.ext.catalog.connection
version: 0.1.0
name: Connections
description: The framework of connections to data sources, with their list, creation, detail, picker and credentials.
kind: [app, service]
platform: '>=0.1 <1'
backend:
  jar: lib/ext-catalog-connection.jar
  api: connections
database:
  # The connections of each organization; their credentials are in the secrets service of the kernel
  # (MK-062), here only the name of each.
  schema: ext_catalog_connection
# Each kind of source is a connector, an extension of its own that implements this contract (EXT-010,
# MK-134) with the interfaces of the library ext-catalog-connection-api.
contracts:
  provides:
    - name: connector
      versions: [1]
      api: io.github.mosaikit.ext:ext-catalog-connection-api
# Each connection is a resource of the kernel (MK-054): the person who creates it owns it, and it is
# shared with the dialog of the platform (MK-055). A person lists the connections they view, browses
# and tests those they use, and changes those they edit (EXT-011, EXT-015).
resources:
  - type: connection
    title: Connection
    i18n: { it: { title: Connessione } }
    levels:
      - { name: view, title: View, i18n: { it: { title: Vedere } } }
      - { name: use, title: Use, i18n: { it: { title: Usare } } }
      - { name: edit, title: Edit, edits: true, i18n: { it: { title: Modificare } } }
      - { name: manage, title: Manage, edits: true, i18n: { it: { title: Gestire } } }
    subjects: [person, group, organization]
frontend:
  entry: web/index.js
  isolation: module
  # Used when the shell isolates the frontend in an iframe (MK-014).
  bridge:
    services: [api]
contributes:
  # The app bar of the shell (MK-025); the texts in other languages are in i18n (MK-053).
  rail.app:
    - id: connections
      title: Connections
      route: /app/connections
      element: mosaikit-ext-catalog-connection
      icon: web/icon.svg
      order: 41
      i18n:
        it: { title: Connessioni }
libraries:
  # Written by the build of the extension from its runtime dependencies (MK-131): do not edit.
  - jar: 'lib/ext-catalog-connection-api-0.1.0.jar'
    coordinates: 'io.github.mosaikit.ext:ext-catalog-connection-api:0.1.0'
    sha256: '9db471bb52ce2ae9b8b81b6f79127cae4d136441e07f82de04dd59145d9af602'
