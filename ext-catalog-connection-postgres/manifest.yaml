id: io.github.mosaikit.ext.catalog.connection.postgres
version: 0.1.0
name: PostgreSQL connector
description: Connections to PostgreSQL databases, with their schemas, tables and views, and read-only queries.
kind: [service]
platform: '>=0.1 <1'
# A connector of the connection framework (EXT-040): without the framework it has nothing to do.
requires:
  io.github.mosaikit.ext.catalog.connection: '>=0.1 <1'
backend:
  jar: lib/ext-catalog-connection-postgres.jar
  # Required with Java code, although a connector serves no REST resource of its own.
  api: catalog-connection-postgres
# The contract of the framework (EXT-010, MK-134), whose interfaces are in the library
# ext-catalog-connection-api. The JDBC driver is the one of the kernel (org.postgresql:postgresql),
# which the build leaves out of the package (MK-131).
contracts:
  implements:
    - contract: io.github.mosaikit.ext.catalog.connection/connector
      version: 1
      api: io.github.mosaikit.ext:ext-catalog-connection-api
libraries:
  # Written by the build of the extension from its runtime dependencies (MK-131): do not edit.
  - jar: 'lib/ext-catalog-connection-api-0.1.0.jar'
    coordinates: 'io.github.mosaikit.ext:ext-catalog-connection-api:0.1.0'
    sha256: '82c4a5464f0bf3547b89b18935922f30edf7367bbceffb8d9189ad3e7fd5de40'
