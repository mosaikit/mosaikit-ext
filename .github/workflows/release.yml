#
# Releases one extension from a tag ext-<name>/vX.Y.Z (EXT-103, ADR-0001): only that extension, as
# io.github.mosaikit.ext:ext-<name> version X.Y.Z, in Maven Central (as Mosaikit publishes its Maven
# artifacts) and in a GitHub release of the tag, whose notes are the section of that version in the
# extension's CHANGELOG.md. What a release decides is in tools/release.py: a tag that the extension
# does not match is refused before anything is published. Actions are pinned by commit.
#
# The secrets are those of the release of Mosaikit, in the environment "release":
# CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE.

name: Release

on:
  push:
    tags: ['ext-*/v*']

# A release is never cancelled; two tags of the same extension run one after the other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The tag against the build, the manifest, package.json and the changelog; the release notes.
  check:
    runs-on: ubuntu-latest
    outputs:
      folder: ${{ steps.check.outputs.folder }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m pip install --quiet pyyaml
      - name: Tests of the release tools
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools -p test_release.py
      - name: Check the tag
        id: check
        run: python3 tools/release.py check "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        run: |
          python3 tools/release.py notes "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md

  # Only the folder of the tag: its package, after its tests on the bench.
  build:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.check.outputs.folder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npx --yes playwright@1 install --with-deps chromium
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ needs.check.outputs.folder }}/target/${{ needs.check.outputs.folder }}-${{ needs.check.outputs.version }}.zip
          if-no-files-found: error

  # Maven Central: the POM, with the required extensions as dependencies, and the zip, signed.
  maven:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: ${{ needs.check.outputs.folder }}/target
      - run: python3 -m pip install --quiet pyyaml
      - name: Sign and publish to Maven Central
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          NAME: ${{ needs.check.outputs.folder }} ${{ needs.check.outputs.version }}
        run: |
          gpg --batch --import <<<"$GPG_PRIVATE_KEY"
          python3 tools/release.py bundle "$GITHUB_REF_NAME" central-bundle.zip --sign
          python3 tools/release.py publish central-bundle.zip "$NAME"

  # The GitHub release of the tag, last: a refused publication leaves no release behind.
  github-release:
    needs: [check, maven]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER: ${{ needs.check.outputs.folder }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$FOLDER-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$FOLDER $VERSION" --notes-file release-notes.md "${flags[@]}"
