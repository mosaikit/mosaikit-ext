#
# Checks of the repository: the requirements (schema, ids, dependencies, also on the requirements
# of Mosaikit), the licence information of every file (REUSE), and that every extension folder is
# self-contained and builds alone once extracted (EXT-102), for the extensions a pull request
# affects (EXT-104). Actions are pinned by commit.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: mosaikit/mosaikit
          path: .mosaikit
          sparse-checkout: docs/requirements
      - name: Requirements
        env:
          MOSAIKIT_REQUIREMENTS: .mosaikit/docs/requirements
        run: |
          python3 -m pip install --quiet pyyaml jsonschema
          python3 docs/requirements/check.py
      - name: Licences (REUSE)
        run: |
          rm -rf .mosaikit
          python3 -m pip install --quiet reuse
          python3 -m reuse lint

  # EXT-104 (ADR-0001): a pull request builds only the extensions it changes and those that require or
  # use them, as their manifests declare; a change to a file of the root builds every extension. Other
  # events build every extension.
  affected:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.select.outputs.extensions }}
      built: ${{ steps.select.outputs.built }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tests of the tools
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest discover -s tools -v
      - name: Extensions to build
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE" ]; then
            python3 tools/affected.py select --base "$BASE" --head HEAD --json --github-output
          else
            python3 tools/affected.py select --all --json --github-output
          fi
      # EXT-102: no file of a selected extension refers to a file outside its folder.
      - name: Self-contained folders
        env:
          EXTENSIONS: ${{ steps.select.outputs.extensions }}
        run: |
          folders=$(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["EXTENSIONS"])))')
          if [ -n "$folders" ]; then python3 tools/check_self_contained.py $folders; fi

  # EXT-102: each selected folder with a build, extracted with git filter-repo as a repository of its
  # own, builds and passes its tests on the latest snapshot of Mosaikit.
  build:
    needs: affected
    if: needs.affected.outputs.built != '[]'
    name: build (${{ matrix.extension }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.affected.outputs.built) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Parent of extensions and extension API
        uses: mosaikit/.github/actions/kernel-api@be624e6d388bec34c10b6d36d52839de0ae22470 # main
        with:
          version: 0.1.0-SNAPSHOT
      - run: npx --yes playwright@1 install --with-deps chromium
      - name: Extracted folder builds and passes its tests
        env:
          EXT_102_BUILD: '1'
          EXT_102_EXTENSIONS: ${{ matrix.extension }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m pip install --quiet git-filter-repo==2.47.0 pyyaml
          python3 -m unittest -v test_check_self_contained.ExtractionTest
        working-directory: tools

  # EXT-104: the one required check of a pull request, whatever set of extensions ran (also none).
  extensions:
    needs: [affected, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools
      - name: Every selected extension passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/affected.py aggregate "$NEEDS"
